# Haleman ruff config — minimal, backend Python only.
line-length = 100
target-version = "py312"
exclude = ["__pycache__"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]

[lint.per-file-ignores]
# Auto-generated by makemigrations — keep Django's output verbatim.
"**/migrations/*" = ["E501", "I001"]
